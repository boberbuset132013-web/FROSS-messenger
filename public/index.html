<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FROSS Messenger</title>
<style>
:root{color-scheme:dark;--bg:#0f1015;--panel:#16181f;--p2:#1d2029;--line:#282b37;--text:#f2f3f7;--muted:#9a9fb0;--accent:#9181ff;--bubble:#232632;--br:16px;--fs:15px;--pad:10px;--danger:#ff6b6b}
:root[data-theme=light]{color-scheme:light;--bg:#eef0f5;--panel:#fff;--p2:#f4f5f9;--line:#e1e4ec;--text:#1b1e27;--muted:#6c7285;--bubble:#e9ecf3}
@media(prefers-color-scheme:light){:root[data-theme=auto]{color-scheme:light;--bg:#eef0f5;--panel:#fff;--p2:#f4f5f9;--line:#e1e4ec;--text:#1b1e27;--muted:#6c7285;--bubble:#e9ecf3}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.45 var(--font,Inter,system-ui,sans-serif)}
button,input,textarea,select{font:inherit;color:var(--text)}
button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--p2);padding:9px 14px}
button:hover{filter:brightness(1.1)}
.pr{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.dg{background:var(--danger);border-color:var(--danger);color:#fff}
.ic{padding:6px 10px;background:none;border-color:transparent;font-size:18px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--p2);padding:11px;border-radius:10px;outline:none;margin:4px 0 10px}
input:focus,textarea:focus{border-color:var(--accent)}input[type=checkbox]{width:auto;margin:0 8px 0 0}input[type=range]{padding:0}
label{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:13px;min-height:18px}.mut{color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;background-size:cover;background-position:center;position:relative}
.av.big{width:84px;height:84px;font-size:32px}.on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3ddc84;border:2px solid var(--panel)}
#auth{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 50%),var(--bg)}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 20px 60px #0004}
.logo{font-size:28px;font-weight:900;letter-spacing:3px;color:var(--accent)}
.steps{display:flex;gap:6px;margin:14px 0}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.d{background:var(--accent)}
.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.sw span{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw span.s{border-color:var(--text)}
.sum{background:var(--p2);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:-6px 0 10px}.meter b{display:block;height:100%;width:0;transition:.2s}
#app{height:100%;display:none;grid-template-columns:320px 1fr}
#call{margin-left:auto;display:none;color:var(--accent);font-size:19px}
.message-menu{position:fixed;z-index:80;display:flex;flex-direction:column;min-width:190px;max-width:260px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0008}
.message-menu button{border:0;text-align:left;background:transparent;padding:9px 11px}
.message-menu button:hover,.reaction-bar button:hover{background:var(--p2)}
.message-menu .reaction-choice{font-size:23px;text-align:center;display:inline-flex;padding:8px}
.reaction-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.reaction-bar button{padding:3px 7px;font-size:12px}
.message-image{display:block;max-width:min(320px,70vw);max-height:280px;object-fit:contain;border-radius:10px;margin:4px 0}
.message-audio{display:block;max-width:280px;width:100%;margin:5px 0}.attachment-link{display:block;color:inherit;font-size:13px;margin:5px 0;overflow-wrap:anywhere}
.call-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:left}
.call-tools label{margin:0}.call-tools select{margin:4px 0 0;padding:7px}
#remote-screen{display:none;width:100%;max-height:42vh;background:#000;border-radius:12px;margin-top:12px}
#local-screen-preview{display:none}
#call-layer{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:30;backdrop-filter:blur(8px)}
#call-layer.open{display:grid}
.call-card{width:min(390px,100%);padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-align:center;box-shadow:0 22px 70px #0007}
.call-card .av{width:76px;height:76px;margin:0 auto 12px;font-size:30px}
.call-actions{display:flex;gap:10px;margin-top:18px}
.call-actions button{flex:1}
.call-status{color:var(--muted);margin-top:8px;min-height:22px}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.me{padding:12px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.me .t{flex:1;min-width:0}
.t b,.t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t small{color:var(--muted);font-size:12px}
.sb{padding:10px 12px 0}.list{overflow:auto;padding:6px 8px;flex:1}
.h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 8px 4px}
.it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}.it:hover,.it.a{background:var(--p2)}.it.a{box-shadow:inset 3px 0 var(--accent)}
.main{display:flex;flex-direction:column;min-width:0}
.head{height:66px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px}#back{display:none}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:4px}
.msgs[data-w=dots]{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.msgs[data-w=grad]{background-image:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--bg)),var(--bg))}
.msgs[data-w=grid]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.mr{display:flex;gap:8px;align-items:flex-end;max-width:78%}.mr.me{align-self:flex-end;flex-direction:row-reverse}
.mr .av{width:30px;height:30px;font-size:13px}.mr.nf{margin-left:38px}
.msg{padding:var(--pad) calc(var(--pad) + 3px);background:var(--incoming,var(--bubble));border-radius:var(--br);overflow-wrap:anywhere;white-space:pre-wrap}
.me .msg{background:var(--outgoing,var(--accent));color:#fff}
:root{--bg:var(--custom-bg,#0f1015);--panel:var(--custom-panel,#16181f);--text:var(--custom-text,#f2f3f7)}.msg b{display:block;font-size:12px;color:var(--accent);white-space:normal}
.msg time{display:block;text-align:right;font-size:10px;opacity:.6}.deleted-account-notice{border:1px dashed color-mix(in srgb,var(--danger) 45%,var(--line));background:color-mix(in srgb,var(--danger) 8%,var(--incoming,var(--bubble)));color:var(--text)}
.comp{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);align-items:flex-end}
.comp textarea{margin:0;border-radius:20px;resize:none;max-height:120px;padding:11px 16px}.comp .pr{border-radius:20px}
.empty{margin:auto;color:var(--muted);text-align:center}
.ov{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px;z-index:10}.ov.o{display:grid}
.md{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.tabs{display:flex;gap:4px;margin:12px 0;border-bottom:1px solid var(--line);overflow:auto}.tabs button{border:0;background:none;border-radius:8px 8px 0 0;color:var(--muted);white-space:nowrap}.tabs .a{color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.chip{display:inline-block;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:2px;font-size:13px}
.sw2{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.sw2 input{width:auto;margin:0}
@media(max-width:700px){#app{grid-template-columns:1fr}.main{display:none}.ch .side{display:none}.ch .main{display:flex}#back{display:block}.mr{max-width:92%}}

/* Motion system: restrained, fast and reduced-motion friendly */
@keyframes fross-enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fross-pop{0%{opacity:0;transform:translateY(8px) scale(.96)}70%{transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes fross-glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 13%,transparent)}}
@keyframes fross-shimmer{to{background-position:200% center}}
@keyframes fross-orbit{to{transform:rotate(360deg)}}
body{overflow:hidden}
#auth{position:relative;isolation:isolate;overflow-x:hidden;overflow-y:auto;align-items:start;min-height:100%;-webkit-overflow-scrolling:touch;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}.card{margin:auto}
#auth:before,#auth:after{content:"";position:absolute;z-index:-1;width:340px;height:340px;border-radius:50%;filter:blur(75px);opacity:.18;pointer-events:none;background:var(--accent);animation:fross-orbit 24s linear infinite}
#auth:before{top:-160px;left:-110px}#auth:after{right:-130px;bottom:-170px;animation-direction:reverse}
.card{animation:fross-enter .55s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(18px);background:color-mix(in srgb,var(--panel) 92%,transparent)}
.logo{background:linear-gradient(100deg,var(--accent),#c4b5fd,var(--accent));background-size:200% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:fross-shimmer 5s linear infinite}
button{transition:transform .18s ease,filter .18s ease,background .18s ease,border-color .18s ease}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.it{transition:background .2s ease,transform .2s ease,box-shadow .2s ease}.it:hover{transform:translateX(3px)}
.av{transition:transform .25s ease,box-shadow .25s ease}.it:hover .av{transform:scale(1.06)}
.msg{animation:fross-pop .28s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 2px 10px #0000000a}
.head,.me,.comp{backdrop-filter:blur(14px)}
.steps i{transition:background .3s ease,transform .3s ease}.steps i.d{animation:fross-glow 1.8s ease-in-out infinite}
.sw span{transition:transform .2s ease,border-color .2s ease}.sw span:hover{transform:scale(1.13)}
.ov{backdrop-filter:blur(8px);opacity:0;transition:opacity .2s ease}.ov.o{opacity:1}
.md{animation:fross-enter .28s ease both}
.empty{animation:fross-enter .4s ease both}
@media(max-width:700px){.card{padding:22px 18px;border-radius:18px}.head{padding:0 12px}.comp{padding:10px}.msgs{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

:root{--accent:#a855f7;--bg:#080611;--panel:#100b1d;--p2:#1a112b;--line:#302044;--text:#f7f0ff;--muted:#a99ab9;--bubble:#21152f;--custom-bg:#080611;--custom-panel:#100b1d;--custom-text:#f7f0ff}
body{background:radial-gradient(ellipse at 20% 0%,#251044 0%,transparent 42%),#080611}
#app{grid-template-columns:300px minmax(0,1fr);background:transparent}
.side{background:linear-gradient(180deg,#130b22f5,#0c0816f8);border-right:1px solid #35204b;box-shadow:12px 0 50px #0003}
.brandbar{height:154px;position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 0;overflow:hidden;border-bottom:1px solid #ffffff0b;background:radial-gradient(ellipse at 60% 75%,#7c2bd52b,transparent 65%)}
.brandmark{font-size:21px;font-weight:950;letter-spacing:3px;color:#fff;text-shadow:0 0 22px #a855f7aa}.brandmark small{display:block;font-size:9px;letter-spacing:4px;color:#c084fc}
.mascot{position:absolute;width:116px;height:116px;right:24px;top:18px;animation:mascot-float 4.6s ease-in-out infinite}
.mascot-body{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle at 68% 24%,#f1d7ff 0 2%,#d879ff 4%,#a52cff 22%,#7216d9 62%,#3b087c 100%);box-shadow:inset -8px -12px 18px #26004d99,inset 5px 6px 15px #f3c5ff66,0 0 25px #a020ff99;animation:mascot-tilt 7s ease-in-out infinite}
.mascot-eye{position:absolute;top:43%;width:17px;height:20px;border-radius:50%;background:#090411;transform:translateY(-50%);transition:height .08s ease,border-radius .08s ease}.mascot-eye.left{left:25%}.mascot-eye.right{right:25%}
.mascot-shine{position:absolute;right:20%;top:13%;width:23px;height:8px;border-radius:50%;background:#fff7ff;transform:rotate(42deg);filter:blur(.5px)}
.mascot-orbit{position:absolute;border:2px solid transparent;border-top-color:#d58aff;border-bottom-color:#8c28ff;border-radius:50%;inset:8px;box-shadow:0 0 9px #a72cff66}
.orbit-a{transform:rotate(-25deg);animation:mascot-orbit 5s linear infinite}.orbit-b{inset:0 3px;transform:rotate(62deg);border-top-color:#8e38ff;border-bottom-color:#d879ff;animation:mascot-orbit 7s linear infinite reverse}
.mascot-spark{position:absolute;width:8px;height:8px;background:#e9b7ff;box-shadow:0 0 12px 4px #a52cff;border-radius:2px;transform:rotate(45deg)}.spark-a{left:5px;top:34px;animation:mascot-twinkle 2.8s ease-in-out infinite}.spark-b{right:0;bottom:26px;animation:mascot-twinkle 3.4s ease-in-out infinite reverse}
.mascot-shadow{position:absolute;bottom:0;left:32px;width:52px;height:8px;border-radius:50%;background:#9a31ff88;filter:blur(8px);animation:mascot-shadow 4.6s ease-in-out infinite}
@keyframes mascot-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-9px)}}@keyframes mascot-shadow{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(.72);opacity:.35}}@keyframes mascot-orbit{to{transform:rotate(335deg)}}@keyframes mascot-tilt{0%,100%{rotate:-2deg}50%{rotate:3deg}}@keyframes mascot-twinkle{0%,100%{opacity:.35;scale:.7}50%{opacity:1;scale:1.2}}
.mascot.blink .mascot-eye{height:3px;border-radius:100%}
.me{padding:12px 14px;border-bottom:1px solid #ffffff12}.me .av{box-shadow:0 0 0 2px #a855f755,0 0 18px #8b35cc55}
.icon-btn{width:38px;height:38px;border:1px solid #ffffff16;background:#ffffff08;border-radius:13px;padding:9px;display:grid;place-items:center}.icon-btn svg,.searchbox svg,.nav-item svg,.chat-action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:#d9b8ff}
.sb{padding:13px 14px 5px}.searchbox{display:flex;align-items:center;gap:9px;padding:0 12px;background:#ffffff09;border:1px solid #ffffff17;border-radius:15px}.searchbox input{border:0;background:transparent;margin:0;padding:12px 0;min-width:0}.searchbox svg{flex:none;color:#bd8af4}
.it{padding:11px 12px;border:1px solid transparent}.it:hover,.it.a{background:linear-gradient(100deg,#9d36ff22,#ffffff05);border-color:#a855f733;box-shadow:inset 3px 0 #b65cff}
.side-bottom{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid #ffffff12;background:#0c0716}
.create-btn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #b65cff66;background:linear-gradient(100deg,#8b24dc,#5b16b2);box-shadow:0 8px 28px #8b24dc44;border-radius:15px;padding:12px;color:white;font-weight:800}
.create-plus{font-size:24px;line-height:16px}.nav-item{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1px solid transparent;color:#b7a5c8;padding:9px}.nav-item.active{background:#a855f722;border-color:#a855f744;color:#efdfff}
.main{background:radial-gradient(ellipse at 50% -10%,#3a176133,transparent 55%),#0b0713}
.head{background:#110b1de8;border-color:#ffffff12}.head .av{box-shadow:0 0 0 2px #a855f744}
.msgs{background-image:radial-gradient(#b47ae50d 1px,transparent 1px);background-size:22px 22px}
.msg{border:1px solid #ffffff0b;box-shadow:0 8px 24px #0003}.me .msg{background:linear-gradient(135deg,#9c36e8,#6920b5)}
.comp{background:#100b1deb;border-color:#ffffff13}.comp textarea{background:#1b1129;border:1px solid #ffffff16}
.pr{background:linear-gradient(135deg,#a53bfa,#7420c7);border:0;box-shadow:0 5px 18px #902ce755}
.card,.md{background:#130d20;border-color:#3a2450;box-shadow:0 24px 80px #0009}
.tabs .a{color:#e8cfff;box-shadow:inset 0 -2px #c084fc}
@media(max-width:700px){
 #app{grid-template-columns:1fr}
 .side{border:0;padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(180deg,#130b22,#0b0715)}
 .brandbar{height:132px;padding-top:12px}.mascot{right:24px;top:8px;scale:.88}
 .me{padding:8px 14px}
 .side-bottom{position:sticky;bottom:0;grid-template-columns:1fr 1fr 1fr;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(20px)}
 .create-btn{grid-column:auto;flex-direction:column;gap:2px;padding:8px 4px;font-size:12px}.create-plus{font-size:22px}
 .nav-item{flex-direction:column;gap:2px;font-size:11px;padding:7px 2px}
 .main{min-height:0}.ch .side{display:none}.ch .main{display:flex}
 .head{height:60px}
}
@media(prefers-reduced-motion:reduce){.mascot,.mascot *{animation:none!important}}
</style></head><body>
<section id="auth"><div class="card" id="ac"></div></section>
<div id="app">
<aside class="side"><div class="brandbar"><div class="brandmark">FROSS <small>MESSENGER</small></div><div class="mascot" id="fross-mascot" aria-label="Персонаж FROSS"><div class="mascot-orbit orbit-a"></div><div class="mascot-orbit orbit-b"></div><div class="mascot-spark spark-a"></div><div class="mascot-spark spark-b"></div><div class="mascot-body"><div class="mascot-eye left"></div><div class="mascot-eye right"></div><div class="mascot-shine"></div></div><div class="mascot-shadow"></div></div></div><div class="me"><div class="av" id="mav"></div><div class="t"><b id="mn"></b><small id="mu"></small></div><button class="icon-btn" id="profile-settings" title="Профиль и кастомизация" aria-label="Профиль"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.7-4 3.2-6 7.5-6s6.8 2 7.5 6"/></svg></button><button class="icon-btn" id="gb" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></button></div>
<div class="sb"><div class="searchbox"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="q" placeholder="Найти человека или чат"></div></div><div class="list" id="list"></div><div class="side-bottom"><button id="nb" class="create-btn"><span class="create-plus">+</span><span>Создать</span></button><button class="nav-item active" id="nav-chats"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 3z"/><path d="M8 9h8M8 13h5"/></svg><span>Чаты</span></button><button class="nav-item" id="nav-people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c.5-3.5 2.5-5.5 6-5.5s5.5 2 6 5.5M16 5.5a3 3 0 0 1 0 5.8M17 15c2.2.5 3.5 2.1 4 5"/></svg><span>Люди</span></button></div></aside>
<main class="main"><div class="head"><button class="ic" id="back">←</button><div class="av" id="hav"></div><div class="t"><b id="ht"></b><small id="hs"></small></div><button class="ic" id="chat-settings" title="Настройки чата" aria-label="Настройки чата">⋯</button><button class="ic" id="call" title="Голосовой звонок" aria-label="Голосовой звонок">📞</button></div>
