<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FROSS Messenger</title><meta name="theme-color" content="#080611"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/fross-icon.webp" type="image/webp"><link rel="apple-touch-icon" href="/fross-icon.webp">
<style>
:root{color-scheme:dark;--bg:#0f1015;--panel:#16181f;--p2:#1d2029;--line:#282b37;--text:#f2f3f7;--muted:#9a9fb0;--accent:#9181ff;--bubble:#232632;--br:16px;--fs:15px;--pad:10px;--danger:#ff6b6b}
:root[data-theme=light]{color-scheme:light;--bg:#eef0f5;--panel:#fff;--p2:#f4f5f9;--line:#e1e4ec;--text:#1b1e27;--muted:#6c7285;--bubble:#e9ecf3}
@media(prefers-color-scheme:light){:root[data-theme=auto]{color-scheme:light;--bg:#eef0f5;--panel:#fff;--p2:#f4f5f9;--line:#e1e4ec;--text:#1b1e27;--muted:#6c7285;--bubble:#e9ecf3}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.45 var(--font,Inter,system-ui,sans-serif)}
button,input,textarea,select{font:inherit;color:var(--text)}
button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--p2);padding:9px 14px}
button:hover{filter:brightness(1.1)}
.pr{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.dg{background:var(--danger);border-color:var(--danger);color:#fff}
.ic{padding:6px 10px;background:none;border-color:transparent;font-size:18px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--p2);padding:11px;border-radius:10px;outline:none;margin:4px 0 10px}
input:focus,textarea:focus{border-color:var(--accent)}input[type=checkbox]{width:auto;margin:0 8px 0 0}input[type=range]{padding:0}
label{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:13px;min-height:18px}.mut{color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;background-size:cover;background-position:center;position:relative}
.av.big{width:84px;height:84px;font-size:32px}.on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3ddc84;border:2px solid var(--panel)}
#auth{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent) 25%,transparent),transparent 50%),var(--bg)}
.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 20px 60px #0004}
.logo{font-size:28px;font-weight:900;letter-spacing:3px;color:var(--accent)}
.steps{display:flex;gap:6px;margin:14px 0}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.d{background:var(--accent)}
.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.sw span{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw span.s{border-color:var(--text)}
.sum{background:var(--p2);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:-6px 0 10px}.meter b{display:block;height:100%;width:0;transition:.2s}
#app{height:100%;display:none;grid-template-columns:320px 1fr}
#call{margin-left:auto;display:none;color:var(--accent);font-size:19px}
.message-menu{position:fixed;z-index:80;display:flex;flex-direction:column;min-width:190px;max-width:260px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0008}
.message-menu button{border:0;text-align:left;background:transparent;padding:9px 11px}
.message-menu button:hover,.reaction-bar button:hover{background:var(--p2)}
.message-menu .reaction-choice{font-size:23px;text-align:center;display:inline-flex;padding:8px}
.reaction-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.reaction-bar button{padding:3px 7px;font-size:12px}
.message-image{display:block;max-width:min(320px,70vw);max-height:280px;object-fit:contain;border-radius:10px;margin:4px 0}
.message-audio{display:block;max-width:280px;width:100%;margin:5px 0}.attachment-link{display:block;color:inherit;font-size:13px;margin:5px 0;overflow-wrap:anywhere}
.upload-progress{align-self:flex-end;width:min(320px,88%);padding:11px 13px;margin:4px 0;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 22px #0003}
.upload-progress-label{display:flex;justify-content:space-between;gap:12px;font-size:12px}.upload-progress-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload-progress-track{height:6px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0 5px}.upload-progress-track i{display:block;width:0;height:100%;background:var(--accent);border-radius:8px;transition:width .12s linear}.upload-progress small{color:var(--muted);font-size:11px}
.read-receipt{display:inline-block;margin-left:5px;font-size:12px;letter-spacing:-4px;padding-right:4px;color:#a5a5b0;font-weight:800}.read-receipt.is-read{color:#55c7ff}
.mention-link,.profile-handle{color:#d8b4fe;text-decoration:none;font-weight:700}.mention-link:hover{text-decoration:underline}
.sender-profile{display:block;padding:0;border:0;background:none;color:#d8b4fe;font-size:12px;font-weight:800;text-align:left;margin-bottom:3px}
.profile-card{text-align:center;padding:8px 2px}.profile-card .av{margin:0 auto 10px}.profile-card h3{margin:4px 0}.profile-card p{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}
.group-contact{display:flex;align-items:center;gap:10px;padding:9px 11px;margin:4px 0;border:1px solid var(--line);border-radius:12px;background:var(--p2);color:var(--text);font-size:13px}.group-contact input{width:18px;height:18px;margin:0;accent-color:var(--accent)}.existing-chat-picker{max-height:240px;overflow:auto}
.call-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;text-align:left}
.call-tools label{margin:0}.call-tools select{margin:4px 0 0;padding:7px}
#remote-screen{display:none;width:100%;max-height:42vh;background:#000;border-radius:12px;margin-top:12px}
#local-screen-preview{display:none}
#call-layer{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:30;backdrop-filter:blur(8px)}
#call-layer.open{display:grid}
.call-card{width:min(390px,100%);padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--panel);text-align:center;box-shadow:0 22px 70px #0007}
.call-card .av{width:76px;height:76px;margin:0 auto 12px;font-size:30px}
.call-actions{display:flex;gap:10px;margin-top:18px}
.call-actions button{flex:1}
.call-status{color:var(--muted);margin-top:8px;min-height:22px}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.me{padding:12px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.me .t{flex:1;min-width:0}
.t b,.t small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.t small{color:var(--muted);font-size:12px}
.sb{padding:10px 12px 0}.list{overflow:auto;padding:6px 8px;flex:1}
.h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:10px 8px 4px}
.it{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}.it:hover,.it.a{background:var(--p2)}.it.a{box-shadow:inset 3px 0 var(--accent)}
.main{display:flex;flex-direction:column;min-width:0}
.head{height:66px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px}#back{display:none}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:4px}
.msgs[data-w=dots]{background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.msgs[data-w=grad]{background-image:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,var(--bg)),var(--bg))}
.msgs[data-w=grid]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px}
.mr{display:flex;gap:8px;align-items:flex-end;max-width:78%}.mr.me{align-self:flex-end;flex-direction:row-reverse}
.mr .av{width:30px;height:30px;font-size:13px}.mr.nf{margin-left:38px}
.msg{padding:var(--pad) calc(var(--pad) + 3px);background:var(--incoming,var(--bubble));border-radius:var(--br);overflow-wrap:anywhere;white-space:pre-wrap}
.me .msg{background:var(--outgoing,var(--accent));color:#fff}
:root{--bg:var(--custom-bg,#0f1015);--panel:var(--custom-panel,#16181f);--text:var(--custom-text,#f2f3f7)}.msg b{display:block;font-size:12px;color:var(--accent);white-space:normal}
.msg time{display:block;text-align:right;font-size:10px;opacity:.6}.deleted-account-notice{border:1px dashed color-mix(in srgb,var(--danger) 45%,var(--line));background:color-mix(in srgb,var(--danger) 8%,var(--incoming,var(--bubble)));color:var(--text)}
.comp{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel);align-items:flex-end}
.comp textarea{margin:0;border-radius:20px;resize:none;max-height:120px;padding:11px 16px}.comp .pr{border-radius:20px}
.empty{margin:auto;color:var(--muted);text-align:center}
.ov{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px;z-index:10}.ov.o{display:grid}
.md{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.tabs{display:flex;gap:4px;margin:12px 0;border-bottom:1px solid var(--line);overflow:auto}.tabs button{border:0;background:none;border-radius:8px 8px 0 0;color:var(--muted);white-space:nowrap}.tabs .a{color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.chip{display:inline-block;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:2px;font-size:13px}
.sw2{display:flex;justify-content:space-between;align-items:center;padding:8px 0}.sw2 input{width:auto;margin:0}
@media(max-width:700px){#app{grid-template-columns:1fr}.main{display:none}.ch .side{display:none}.ch .main{display:flex}#back{display:block}.mr{max-width:92%}}

/* Motion system: restrained, fast and reduced-motion friendly */
@keyframes fross-enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fross-pop{0%{opacity:0;transform:translateY(8px) scale(.96)}70%{transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes fross-glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 13%,transparent)}}
@keyframes fross-shimmer{to{background-position:200% center}}
@keyframes fross-orbit{to{transform:rotate(360deg)}}
body{overflow:hidden}
#auth{position:relative;isolation:isolate;overflow-x:hidden;overflow-y:auto;align-items:start;min-height:100%;-webkit-overflow-scrolling:touch;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}.card{margin:auto}
#auth:before,#auth:after{content:"";position:absolute;z-index:-1;width:340px;height:340px;border-radius:50%;filter:blur(75px);opacity:.18;pointer-events:none;background:var(--accent);animation:fross-orbit 24s linear infinite}
#auth:before{top:-160px;left:-110px}#auth:after{right:-130px;bottom:-170px;animation-direction:reverse}
.card{animation:fross-enter .55s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(18px);background:color-mix(in srgb,var(--panel) 92%,transparent)}
.logo{background:linear-gradient(100deg,var(--accent),#c4b5fd,var(--accent));background-size:200% auto;background-clip:text;-webkit-background-clip:text;color:transparent;animation:fross-shimmer 5s linear infinite}
button{transition:transform .18s ease,filter .18s ease,background .18s ease,border-color .18s ease}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.it{transition:background .2s ease,transform .2s ease,box-shadow .2s ease}.it:hover{transform:translateX(3px)}
.av{transition:transform .25s ease,box-shadow .25s ease}.it:hover .av{transform:scale(1.06)}
.msg{animation:fross-pop .28s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 2px 10px #0000000a}
.head,.me,.comp{backdrop-filter:blur(14px)}
.steps i{transition:background .3s ease,transform .3s ease}.steps i.d{animation:fross-glow 1.8s ease-in-out infinite}
.sw span{transition:transform .2s ease,border-color .2s ease}.sw span:hover{transform:scale(1.13)}
.ov{backdrop-filter:blur(8px);opacity:0;transition:opacity .2s ease}.ov.o{opacity:1}
.md{animation:fross-enter .28s ease both}
.empty{animation:fross-enter .4s ease both}
@media(max-width:700px){.card{padding:22px 18px;border-radius:18px}.head{padding:0 12px}.comp{padding:10px}.msgs{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

:root{--accent:#a855f7;--bg:#080611;--panel:#100b1d;--p2:#1a112b;--line:#302044;--text:#f7f0ff;--muted:#a99ab9;--bubble:#21152f;--custom-bg:#080611;--custom-panel:#100b1d;--custom-text:#f7f0ff}
body{background:radial-gradient(ellipse at 20% 0%,#251044 0%,transparent 42%),#080611}

 .mascot{position:absolute;width:116px;height:116px;right:24px;top:18px;filter:drop-shadow(0 9px 16px #7c2bd566);transform:rotate(-8deg)}
 .mascot-body{position:absolute;inset:22px 19px 19px 23px;border-radius:44% 56% 58% 42% / 43% 42% 58% 57%;background:radial-gradient(ellipse at 32% 20%,#f7eaff 0 2%,#e7baff 5%,#c06aff 18%,#922fe2 43%,#6814b2 73%,#35075f 100%);box-shadow:inset 7px 8px 13px #ffffff45,inset -12px -15px 20px #260044a8,0 0 0 1px #e9c6ff88,0 8px 24px #8b24d977}
 .mascot-body:before{content:"";position:absolute;left:16%;top:13%;width:34%;height:10%;border-radius:50%;background:#fff9ffb8;filter:blur(2px);transform:rotate(-35deg)}

 .mascot-eye{position:absolute;z-index:2;top:49%;width:12px;height:16px;border-radius:55% 45% 48% 52%;background:radial-gradient(circle at 35% 25%,#4a2360,#100719 68%);box-shadow:0 1px 3px #21003c99;transform:translateY(-50%) rotate(-7deg)}
 .mascot-eye.left{left:24%}.mascot-eye.right{right:24%}

 .spark-a{left:7px;top:33px}.spark-b{right:2px;bottom:25px}

 .mascot:after{content:"";position:absolute;z-index:0;left:29px;right:29px;bottom:1px;height:8px;border-radius:50%;background:#b04cff88;filter:blur(8px)}

/* Avatar editor */
#avatar-crop-preview{width:240px;height:240px;max-width:72vw;max-height:72vw;margin:16px auto;border-radius:50%;border:3px solid #d6a4ff;box-shadow:0 0 0 7px #a855f722,0 0 34px #9b35ff55;background-repeat:no-repeat;position:relative;overflow:hidden;touch-action:none}
#avatar-crop-preview:after{content:"";position:absolute;inset:0;border:1px solid #ffffff55;border-radius:50%;pointer-events:none}
#avatar-zoom-value{float:right;color:var(--accent);font-weight:700}
#avatar-zoom{accent-color:var(--accent)}
 /* Static mascot finish: preserve the new silhouette, no character motion */
 .mascot{filter:drop-shadow(0 0 18px #9b37ff55)}
 .mascot-body{z-index:1}
 .mascot-eye{z-index:2}
 .mascot-orbit{z-index:2;border-width:2px;border-top-color:#f0c6ff;border-bottom-color:#8e22ff;filter:drop-shadow(0 0 5px #b94aff)}
 .orbit-a{inset:8px 11px;transform:rotate(-28deg)}
 .orbit-b{inset:0 4px;transform:rotate(62deg)}
 .mascot-spark{z-index:3}
@media(prefers-reduced-motion:reduce){#avatar-crop-preview{scroll-behavior:auto}}
#auth .card{max-height:calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
@media(max-width:700px){#auth .card{max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}}

/* Supplied FROSS mascot art and consistent interface motion */
.mascot-image{width:200px;height:160px;right:0;top:0;object-fit:contain;object-position:center;border:0;border-radius:0;transform:none;filter:drop-shadow(0 0 18px #9b37ff66)}
@media(max-width:700px){.brandbar{height:132px}.mascot-image{width:190px;height:150px;right:0;top:0;object-fit:contain}}
#list .it{animation:fross-enter .32s both;transition:background .2s,border-color .2s,transform .2s}
#list .it:active{transform:scale(.985)}
.mr{animation:fross-pop .24s cubic-bezier(.2,.8,.2,1) both}
.head,.comp,.me,.side-bottom,.sb{transition:background .25s,border-color .25s}
.ov{opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease}
.ov.o{opacity:1;visibility:visible}
.ov.o .md{animation:fross-enter .28s cubic-bezier(.2,.8,.2,1) both}
.md{transition:transform .22s,opacity .22s}
.tabs button{transition:color .2s,background .2s,box-shadow .2s}
input,textarea,select{transition:border-color .2s,box-shadow .2s,background .2s}
#fross-update-banner{position:fixed;z-index:120;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #b65cff66;border-radius:16px;background:#170d27f2;color:#fff;box-shadow:0 14px 44px #0009;backdrop-filter:blur(18px);opacity:0;transform:translateY(18px);pointer-events:none;transition:opacity .25s,transform .25s}
#fross-update-banner.visible{opacity:1;transform:translateY(0);pointer-events:auto}
#fross-update-banner span{font-size:13px;line-height:1.35}
#fross-update-banner button{white-space:nowrap;font-size:12px;padding:9px 12px}
@media(max-width:420px){#fross-update-banner{align-items:flex-start;flex-direction:column}#fross-update-banner button{width:100%}}
@media(prefers-reduced-motion:reduce){#list .it,.mr,.ov,.ov.o .md,#fross-update-banner{animation:none!important;transition:none!important}}

/* Message sizing, replies and live reaction states */
.msg{width:fit-content;max-width:min(78%,680px);min-width:72px;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
.msg img,.msg audio{max-width:100%;height:auto}
.reaction-bar button.mine-reaction{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.reply-preview{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:#20132f;border-top:1px solid #ffffff16}
.reply-preview span{display:grid;min-width:0}.reply-preview small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70vw;color:#bba9cc}
.reply-preview button{border:0;background:transparent;font-size:24px}
.reply-quote{display:grid;text-align:left;width:100%;padding:7px 9px;margin-bottom:7px;border:0;border-left:3px solid var(--accent);border-radius:7px;background:#0002;color:inherit}
.reply-quote span{opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-highlight .msg{outline:2px solid var(--accent);outline-offset:3px}
#nav-people{display:flex}

/* Refined category settings and non-destructive avatar cropper */
#md{max-height:min(92dvh,860px);overflow:auto;overscroll-behavior:contain}
.settings-head{margin-bottom:17px}.settings-head h3{margin:0;font-size:22px;letter-spacing:-.025em}.settings-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.settings-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;min-height:340px}
.settings-categories{display:grid;gap:7px;align-content:start}
.settings-category{display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;align-items:center;text-align:left;gap:1px 9px;padding:11px;border:1px solid #ffffff12;border-radius:14px;background:#ffffff05;color:var(--text);transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.settings-category>span{grid-row:1/3;font-size:19px;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#ffffff09}
.settings-category b{font-size:13px}.settings-category small{font-size:10px;color:var(--muted);line-height:1.35}
.settings-category:hover{transform:translateX(2px);border-color:#a855f766;background:#a855f710}.settings-category>span{transition:transform .22s,background .22s}.settings-category:hover>span{transform:scale(1.08) rotate(-5deg);background:#a855f722}
.settings-content .sw2{transition:background .2s,border-color .2s,transform .2s}.settings-content .sw2:hover{background:#ffffff0a;transform:translateX(2px)}
.settings-content input:focus,.settings-content textarea:focus,.settings-content select:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.settings-content button{transition:transform .18s,filter .18s,background .18s}.settings-content button:hover{filter:brightness(1.08)}
.settings-category.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);box-shadow:inset 3px 0 var(--accent),0 5px 18px #0002}
.settings-content{min-width:0;max-height:58dvh;overflow:auto;padding:4px 5px 12px 2px;scrollbar-width:thin}
.settings-content-enter{animation:fross-enter .24s ease both}
.settings-section-title{padding:2px 0 12px;border-bottom:1px solid #ffffff12;margin-bottom:14px}
.settings-section-title h4{font-size:17px;margin:0 0 4px}.settings-section-title p{font-size:12px;color:var(--muted);margin:0}
.settings-content h4{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:18px 0 8px}
.settings-content label{display:block;margin-top:12px}
.settings-content input:not([type=checkbox]):not([type=range]),.settings-content textarea,.settings-content select{width:100%}
.settings-footnote{font-size:12px;margin:14px 0 4px}
.settings-info-card{display:grid;gap:4px;padding:13px;margin-top:15px;border:1px solid #ffffff13;border-radius:13px;background:#ffffff06;font-size:13px}
.settings-info-card span{font-size:12px;color:var(--muted);line-height:1.5}
.settings-actions{position:sticky;bottom:-1px;padding-top:12px;margin-top:10px;background:linear-gradient(180deg,transparent,var(--panel) 20%);z-index:2}
.profile-photo-editor{display:flex;align-items:center;gap:15px;padding:14px;border:1px solid #ffffff15;border-radius:16px;background:#ffffff05;margin:4px 0 16px}
.profile-photo-actions{display:grid;gap:7px;min-width:0}.profile-photo-actions button{justify-self:start}
.photo-state{font-size:11px;color:var(--muted);line-height:1.4}.photo-state.pending{color:#c49bff}
.avatar-crop-layer{position:fixed;inset:0;z-index:250;display:grid;place-items:center;padding:18px;background:#05020bdc;backdrop-filter:blur(12px);animation:fross-enter .18s ease both}
.avatar-crop-card{width:min(440px,100%);max-height:94dvh;overflow:auto;padding:20px;border:1px solid #ffffff22;border-radius:24px;background:#160d25;box-shadow:0 28px 90px #000b}
.avatar-crop-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.avatar-crop-heading b,.avatar-crop-heading small{display:block}.avatar-crop-heading b{font-size:19px}.avatar-crop-heading small{font-size:12px;color:#bbaaca;margin-top:4px}
.avatar-crop-close{width:34px;height:34px;padding:0;border-radius:50%;font-size:22px}
.avatar-crop-preview{width:240px;height:240px;max-width:68vw;max-height:68vw;margin:18px auto;border-radius:50%;border:3px solid #d6a4ff;box-shadow:0 0 0 8px #a855f722,0 0 35px #9b35ff55;background-repeat:no-repeat;position:relative;overflow:hidden;touch-action:none}
.avatar-crop-preview:after{content:"";position:absolute;inset:0;border:1px solid #ffffff66;border-radius:50%;pointer-events:none}
.avatar-crop-scale{display:flex;justify-content:space-between;font-size:13px}.avatar-zoom-value{color:#d8b2ff;font-weight:800}
.avatar-zoom{width:100%;accent-color:#b66aff;margin:10px 0 18px}
.avatar-crop-actions{display:flex;gap:9px}.avatar-crop-actions button{flex:1}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
.settings-category:focus-visible,.settings-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.profile-photo-editor .av{flex:none}
@media(max-width:650px){
 .settings-layout{grid-template-columns:1fr;gap:10px;min-height:0}
 .settings-categories{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .settings-category{padding:9px;grid-template-columns:26px minmax(0,1fr);gap:1px 7px}
 .settings-category>span{width:26px;height:26px;font-size:16px}
 .settings-category small{font-size:9px}
 .settings-content{max-height:42dvh;padding:4px 2px 10px}
 .settings-actions{padding-bottom:4px}
 .profile-photo-editor{align-items:flex-start}
 .avatar-crop-card{padding:17px;border-radius:20px}
}
@media(prefers-reduced-motion:reduce){.settings-category,.settings-content-enter,.avatar-crop-layer{animation:none!important;transition:none!important}}
</style></head><body>
