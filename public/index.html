<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101116"><title>FROSS Messenger</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#171920;--line:#2a2d38;--text:#f4f5f8;--muted:#9ca1b2;--accent:#9181ff;--bubble:#252833}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#222530;color:var(--text);padding:9px 13px}.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}.muted{color:var(--muted)}#auth{min-height:100%;display:grid;place-items:center;padding:20px}.auth-card{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}.auth-card h1{margin:0 0 5px}.auth-card p{margin:0 0 20px;color:var(--muted)}input{width:100%;border:1px solid var(--line);background:#101319;color:var(--text);padding:12px;border-radius:10px;outline:none;margin:6px 0 12px}.auth-actions{display:flex;gap:8px}.auth-actions button{flex:1}#app{height:100%;display:none;grid-template-columns:290px 1fr}.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{padding:20px;font-size:20px;font-weight:800;border-bottom:1px solid var(--line)}.profile{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.chat-list{padding:12px;overflow:auto}.chat{display:flex;width:100%;text-align:left;align-items:center;gap:10px;margin-bottom:5px;background:transparent;border-color:transparent}.chat.active,.chat:hover{background:#262333;border-color:#39344e}.avatar{width:38px;height:38px;border-radius:50%;background:#554a82;display:grid;place-items:center;font-weight:800;flex:none}.chat small{display:block;color:var(--muted);font-size:11px}.main{display:flex;flex-direction:column;min-width:0}.head{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:9px}.msg{max-width:min(72%,620px);padding:10px 13px;background:var(--bubble);border-radius:14px;align-self:flex-start;overflow-wrap:anywhere}.msg.mine{background:#5145a0;align-self:flex-end}.msg b{display:block;font-size:11px;color:#c9bdff;margin-bottom:3px}.msg time{display:block;text-align:right;font-size:10px;opacity:.6;margin-top:4px}.composer{display:flex;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}.composer input{margin:0;border-radius:22px}.composer button{min-width:110px}.empty{margin:auto;color:var(--muted);text-align:center}.error{color:#ff9292;min-height:20px;font-size:12px}#mobileBack{display:none}@media(max-width:700px){#app{grid-template-columns:1fr}.sidebar{display:flex}.main{display:none}.chatting .sidebar{display:none}.chatting .main{display:flex}#mobileBack{display:block}.msg{max-width:88%}.head{padding:0 12px}.messages{padding:14px}.composer{padding:10px}}
</style></head><body>
<section id="auth"><div class="auth-card"><h1>💬 FROSS Messenger</h1><p>Ваши чаты — на всех устройствах</p><label>Имя пользователя</label><input id="username" maxlength="20" autocomplete="username" placeholder="например, denhic"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="Не менее 8 символов"><div class="error" id="authError"></div><div class="auth-actions"><button class="primary" id="loginBtn">Войти</button><button id="registerBtn">Регистрация</button></div></div></section>
<div id="app"><aside class="sidebar"><div class="brand">💬 FROSS Messenger</div><div class="profile"><div><b id="myName"></b><small class="muted">Аккаунт</small></div><button id="logout">Выйти</button></div><div class="chat-list" id="chatList"></div></aside><main class="main"><header class="head"><button id="mobileBack">←</button><div class="avatar" id="headAvatar">#</div><div><b id="chatTitle">Общий чат</b><small class="muted" id="chatSub">Сообщения доступны всем</small></div></header><section class="messages" id="messages"><div class="empty">Загрузка…</div></section><form class="composer" id="sendForm"><input id="messageInput" maxlength="4000" placeholder="Напишите сообщение…" autocomplete="off"><button class="primary">Отправить</button></form></main></div>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem("fross_token")||"",me=null,current="general",poller=null;
async function api(path,body){const r=await fetch("/api"+path,{method:body===undefined?"GET":"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw Error("Сервер вернул не JSON (HTTP "+r.status+"). "+raw.slice(0,180))}if(!r.ok)throw Error([d.error,d.diagnostic].filter(Boolean).join(" — ")||"Ошибка "+r.status);return d}
function showError(s){$("authError").textContent=s}
async function auth(kind){showError("");try{const d=await api("/"+kind,{username:$("username").value.trim(),password:$("password").value});token=d.token;localStorage.setItem("fross_token",token);await boot()}catch(e){showError(e.message)}}
$("loginBtn").onclick=()=>auth("login");$("registerBtn").onclick=()=>auth("register");$("password").onkeydown=e=>{if(e.key==="Enter")auth("login")};
function addChat(id,title){const b=document.createElement("button");b.className="chat"+(id===current?" active":"");const a=document.createElement("span");a.className="avatar";a.textContent=title[0]?.toUpperCase()||"#";const t=document.createElement("span");t.innerHTML="";const strong=document.createElement("b");strong.textContent=title;t.append(strong);b.append(a,t);b.onclick=()=>{current=id;document.body.classList.add("chatting");renderChats();loadMessages()};$("chatList").append(b)}
function renderChats(){ $("chatList").innerHTML="";addChat("general","Общий чат");}
async function loadMessages(){try{const d=await api("/messages?chat="+encodeURIComponent(current));const box=$("messages"),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;box.innerHTML="";if(!d.messages.length){const e=document.createElement("div");e.className="empty";e.textContent="Пока нет сообщений. Начните разговор!";box.append(e)}for(const m of d.messages){const el=document.createElement("article");el.className="msg"+(m.username===me.username?" mine":"");if(m.username!==me.username){const n=document.createElement("b");n.textContent=m.username;el.append(n)}el.append(document.createTextNode(m.body));const tm=document.createElement("time");tm.textContent=new Date(m.created_at).toLocaleString("ru-RU",{hour:"2-digit",minute:"2-digit"});el.append(tm);box.append(el)}if(atBottom)box.scrollTop=box.scrollHeight;$("chatTitle").textContent=current==="general"?"Общий чат":current;$("chatSub").textContent="Общая комната"}catch(e){$("messages").textContent=e.message}}
$("sendForm").onsubmit=async e=>{e.preventDefault();const input=$("messageInput"),body=input.value.trim();if(!body)return;input.value="";try{await api("/messages",{chat:current,body});await loadMessages()}catch(err){alert(err.message);input.value=body}};
$("mobileBack").onclick=()=>document.body.classList.remove("chatting");
$("logout").onclick=async()=>{try{await api("/logout",{})}catch{}token="";localStorage.removeItem("fross_token");if(poller)clearInterval(poller);$("app").style.display="none";$("auth").style.display="grid"};
async function boot(){try{const d=await api("/me");me=d.user;$("myName").textContent=me.username;$("auth").style.display="none";$("app").style.display="grid";renderChats();await loadMessages();if(poller)clearInterval(poller);poller=setInterval(loadMessages,2500)}catch(e){token="";localStorage.removeItem("fross_token");$("auth").style.display="grid";$("app").style.display="none";showError("Сессия истекла. Войдите снова.")}}
if(token)boot();
</script></body></html>
