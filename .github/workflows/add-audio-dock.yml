name: Add persistent audio dock and deploy

on:
  push:
    branches: [main]
    paths:
      - "scripts/add_audio_dock.py"
      - ".github/workflows/add-audio-dock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-audio-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Add persistent audio player
        run: python3 scripts/add_audio_dock.py

      - name: Validate the complete application
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run validate

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/firebase-app.js public/sw.js
          if git diff --cached --quiet; then
            echo "Audio dock already present; the current production source will be deployed."
          else
            git commit -m "Add persistent cross-chat audio player"
            git push origin HEAD:main
          fi

      - name: Deploy Cloudflare Worker with Filebase secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare credentials are not configured."
            exit 1
          fi
          if [ -z "$FILEBASE_ACCESS_KEY" ] || [ -z "$FILEBASE_SECRET_KEY" ]; then
            echo "::error::Configure FILEBASE_ACCESS_KEY and FILEBASE_SECRET_KEY repository secrets."
            exit 1
          fi
          ACCOUNT_RESPONSE=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if ! echo "$ACCOUNT_RESPONSE" | jq -e '.success == true' >/dev/null; then
            echo "::error::Cloudflare credentials were rejected. Check token permissions and account ID."
            echo "$ACCOUNT_RESPONSE" | jq -r '.errors[]?.message // empty' | sed 's/.*/Cloudflare API: &/'
            exit 1
          fi
          umask 077
          SECRETS_FILE="$(mktemp)"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          jq -n --arg access "$FILEBASE_ACCESS_KEY" --arg secret "$FILEBASE_SECRET_KEY"             '{FILEBASE_ACCESS_KEY: $access, FILEBASE_SECRET_KEY: $secret}' > "$SECRETS_FILE"
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" npx wrangler deploy --config ./wrangler.toml --assets ./public/ --secrets-file "$SECRETS_FILE"
