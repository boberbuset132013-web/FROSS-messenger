name: Deploy FROSS Messenger

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "worker.js"
      - "wrangler.toml"
      - "firestore.rules"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Cloudflare Worker if credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deploy skipped; configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Cloudflare Git integration may deploy independently."
            exit 0
          fi
          npm install --no-audit --no-fund
          # Validate credentials first; never dump secret values into logs.
          ACCOUNT_RESPONSE=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if ! echo "$ACCOUNT_RESPONSE" | jq -e '.success == true' >/dev/null; then
            echo "::error::Cloudflare credentials were rejected. Check CLOUDFLARE_API_TOKEN permissions and the 32-character CLOUDFLARE_ACCOUNT_ID secret."
            echo "$ACCOUNT_RESPONSE" | jq -r '.errors[]?.message // empty' | sed 's/.*/Cloudflare API: &/'
            exit 1
          fi
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" npx wrangler deploy --config ./wrangler.toml --assets ./public/
      - name: Authenticate Firebase service account
        if: always() && env.HAS_FIREBASE_SECRET == 'true'
        uses: google-github-actions/auth@v2
        env:
          HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firebase rules, indexes and Functions if credentials are configured
        if: always()
        env:
          HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_FIREBASE_SECRET" != "true" ]; then
            echo "::notice::Firebase deploy skipped; configure FIREBASE_SERVICE_ACCOUNT as the full service-account JSON."
            exit 0
          fi
          npm install --global firebase-tools
          firebase deploy --only firestore:rules,firestore:indexes,storage,functions --project fross-ca5d6
