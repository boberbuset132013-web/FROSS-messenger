name: Deploy FROSS Messenger

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "worker.js"
      - "wrangler.toml"
      - "firestore.rules"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Cloudflare Worker if credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deploy skipped; configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Cloudflare Git integration may deploy independently."
            exit 0
          fi
          npm install --no-audit --no-fund
          # Validate credentials first; never dump secret values into logs.
          ACCOUNT_RESPONSE=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if ! echo "$ACCOUNT_RESPONSE" | jq -e '.success == true' >/dev/null; then
            echo "::error::Cloudflare credentials were rejected. Check CLOUDFLARE_API_TOKEN permissions and the 32-character CLOUDFLARE_ACCOUNT_ID secret."
            echo "$ACCOUNT_RESPONSE" | jq -r '.errors[]?.message // empty' | sed 's/.*/Cloudflare API: &/'
            exit 1
          fi
          if [ -z "$FILEBASE_ACCESS_KEY" ] || [ -z "$FILEBASE_SECRET_KEY" ]; then
            echo "::error::Configure FILEBASE_ACCESS_KEY and FILEBASE_SECRET_KEY in GitHub repository secrets."
            exit 1
          fi
          printf '%s' "$FILEBASE_ACCESS_KEY" | npx wrangler secret put FILEBASE_ACCESS_KEY --config ./wrangler.toml
          printf '%s' "$FILEBASE_SECRET_KEY" | npx wrangler secret put FILEBASE_SECRET_KEY --config ./wrangler.toml
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" npx wrangler deploy --config ./wrangler.toml --assets ./public/
