name: Deploy FROSS Messenger

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "worker.js"
      - "wrangler.toml"
      - "firestore.rules"
      - "storage.rules"
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Cloudflare Worker if credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FILEBASE_ACCESS_KEY: ${{ secrets.FILEBASE_ACCESS_KEY }}
          FILEBASE_SECRET_KEY: ${{ secrets.FILEBASE_SECRET_KEY }}
          FROSS_TURN_URLS: ${{ secrets.FROSS_TURN_URLS }}
          FROSS_TURN_USERNAME: ${{ secrets.FROSS_TURN_USERNAME }}
          FROSS_TURN_CREDENTIAL: ${{ secrets.FROSS_TURN_CREDENTIAL }}
          FROSS_TURN_KEY_ID: ${{ secrets.FROSS_TURN_KEY_ID }}
          FROSS_TURN_API_TOKEN: ${{ secrets.FROSS_TURN_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deploy skipped; configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Cloudflare Git integration may deploy independently."
            exit 0
          fi
          npm install --no-audit --no-fund
          # Validate credentials first; never dump secret values into logs.
          ACCOUNT_RESPONSE=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if ! echo "$ACCOUNT_RESPONSE" | jq -e '.success == true' >/dev/null; then
            echo "::error::Cloudflare credentials were rejected. Check CLOUDFLARE_API_TOKEN permissions and the 32-character CLOUDFLARE_ACCOUNT_ID secret."
            echo "$ACCOUNT_RESPONSE" | jq -r '.errors[]?.message // empty' | sed 's/.*/Cloudflare API: &/'
            exit 1
          fi
          if [ -n "$FROSS_TURN_KEY_ID" ] && [ -n "$FROSS_TURN_API_TOKEN" ]; then
            echo "::notice::Cloudflare TURN key ID and API token are both configured."
          else
            echo "::warning::Cloudflare TURN is NOT configured. Add FROSS_TURN_KEY_ID and FROSS_TURN_API_TOKEN GitHub Actions secrets. TURN API token requires Calls Write / Realtime permissions."
          fi
          if [ -z "$FILEBASE_ACCESS_KEY" ] || [ -z "$FILEBASE_SECRET_KEY" ]; then
            echo "::error::Configure FILEBASE_ACCESS_KEY and FILEBASE_SECRET_KEY in GitHub repository secrets."
            exit 1
          fi
          # Keep a stable webhook secret derived from the bot token if no explicit secret was supplied.
          WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -z "$WEBHOOK_SECRET" ]; then
            WEBHOOK_SECRET="$(printf '%s' "$TELEGRAM_BOT_TOKEN:fross-webhook-v1" | sha256sum | cut -d ' ' -f 1)"
          fi
          # Deploy code and secrets atomically. This avoids a race with Cloudflare Worker versions.
          umask 077
          SECRETS_FILE="$(mktemp)"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          jq -n --arg access "$FILEBASE_ACCESS_KEY" --arg secret "$FILEBASE_SECRET_KEY" \
            --arg turn_urls "$FROSS_TURN_URLS" --arg turn_user "$FROSS_TURN_USERNAME" --arg turn_credential "$FROSS_TURN_CREDENTIAL" \
            --arg cf_turn_key_id "$FROSS_TURN_KEY_ID" --arg cf_turn_api_token "$FROSS_TURN_API_TOKEN" \
            --arg telegram_token "$TELEGRAM_BOT_TOKEN" --arg telegram_secret "$WEBHOOK_SECRET" \
            '{FILEBASE_ACCESS_KEY: $access, FILEBASE_SECRET_KEY: $secret} + (if $turn_urls != "" and $turn_user != "" and $turn_credential != "" then {FROSS_TURN_URLS: $turn_urls, FROSS_TURN_USERNAME: $turn_user, FROSS_TURN_CREDENTIAL: $turn_credential} else {} end) + (if $cf_turn_key_id != "" and $cf_turn_api_token != "" then {FROSS_TURN_KEY_ID: $cf_turn_key_id, FROSS_TURN_API_TOKEN: $cf_turn_api_token} else {} end) + (if $telegram_token != "" and $telegram_secret != "" then {TELEGRAM_BOT_TOKEN: $telegram_token, TELEGRAM_WEBHOOK_SECRET: $telegram_secret} else {} end)' > "$SECRETS_FILE"
          CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" npx wrangler deploy --config ./wrangler.toml --assets ./public/ --secrets-file "$SECRETS_FILE"
      - name: Deploy Firebase group deletion and Firestore rules when credentials are configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FROSS_CA5D6 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::notice::Firebase deploy skipped. Configure FIREBASE_SERVICE_ACCOUNT_FROSS_CA5D6 to publish Firestore rules and deleteGroupForEveryone."
            exit 0
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/fross-firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fross-firebase-service-account.json"
          npm install --prefix functions --no-audit --no-fund
          npx --yes firebase-tools deploy --only firestore:rules,functions:deleteGroupForEveryone --project fross-ca5d6 --non-interactive
