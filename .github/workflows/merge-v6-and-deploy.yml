name: Merge uploaded FROSS v6 and deploy

on:
  push:
    branches: [main]
    paths:
      - ".merge/parts/**"
      - ".merge/archive.sha256"
      - "scripts/add_audio_dock.py"
      - ".merge/FROSS-messenger-v6.zip"
      - "scripts/merge_uploaded_v6.py"
      - ".github/workflows/merge-v6-and-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Merge uploaded v6 with current production fixes
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .merge/FROSS-messenger-v6.zip ] && [ ! -d .merge/parts ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "No pending archive; this is the clean-up trigger run."
            exit 0
          fi
          python3 scripts/merge_uploaded_v6.py
          python3 scripts/add_audio_dock.py
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies and run project validation
        if: steps.merge.outputs.merged == 'true'
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run validate

      - name: Commit the merged source
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "Merge uploaded FROSS v6 features with current fixes"
          git push origin HEAD:main

      - name: Deployment hand-off
        if: steps.merge.outputs.merged == 'true'
        run: echo "Merged source pushed to main; the standard Deploy FROSS Messenger workflow publishes it."
