name: Deploy FROSS Firebase backend

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Firebase rules and available backend functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Firebase deployment skipped. Add FIREBASE_SERVICE_ACCOUNT to GitHub Actions secrets."
            exit 0
          fi
          umask 077
          CREDENTIALS_FILE="$(mktemp)"
          trap 'rm -f "$CREDENTIALS_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"
          npm install --global firebase-tools
          set +e
          firebase deploy --only firestore:rules,firestore:indexes --project fross-ca5d6 --non-interactive --force
          RULES_STATUS=$?
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            firebase deploy --only functions:deleteGroupForEveryone --project fross-ca5d6 --non-interactive --force
            GROUP_STATUS=$?
            echo "::warning::Telegram bot functions are skipped until TELEGRAM_BOT_TOKEN is present."
            [ "$RULES_STATUS" -eq 0 ] && [ "$GROUP_STATUS" -eq 0 ] || exit 1
            exit 0
          fi
          WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET"
          if [ -z "$WEBHOOK_SECRET" ]; then WEBHOOK_SECRET="$(openssl rand -hex 32)"; fi
          set -e
          printf '%s' "$TELEGRAM_BOT_TOKEN" | firebase functions:secrets:set TELEGRAM_BOT_TOKEN --data-file - --project fross-ca5d6 --force
          printf '%s' "$WEBHOOK_SECRET" | firebase functions:secrets:set TELEGRAM_WEBHOOK_SECRET --data-file - --project fross-ca5d6 --force
          set +e
          firebase deploy --only functions --project fross-ca5d6 --non-interactive --force
          FUNCTIONS_STATUS=$?
          if [ "$RULES_STATUS" -ne 0 ] || [ "$FUNCTIONS_STATUS" -ne 0 ]; then
            echo "::error::Firebase deploy incomplete. Check the Rules IAM permissions and Cloud Build / Artifact Registry API permissions."
            exit 1
          fi
